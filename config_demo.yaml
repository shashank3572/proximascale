# config_demo.yaml — DEMO ONLY. Never quote numbers from a run of this file.
#
# Differences from config.yaml, and why each exists:
#
#   min_containers: 0            lets the fleet collapse completely so the
#                                audience sees scale-down actually happen
#                                (config.yaml stops at 1 by design)
#   cooldown_seconds: 60         shorter hysteresis lock, so a 10-15 minute
#                                panel run can show scale-up AND scale-down
#   adaptive_window: 8           the band forgets a spike in ~4 min instead of
#                                ~15 min (8 polls vs 30)
#   adaptive_min_samples: 5      reaches adaptive mode sooner with 8 samples
#   use_upper_bound_risk: true   demonstrate the preemptive branch on forecast
#                                uncertainty (disabled in config.yaml because
#                                validation showed it added early scale-ups)
#   use_anomaly_bypass: true     demonstrate the anomaly branch
#   anomaly_min_interval 300     one spike adds at most ONE container, instead
#                                of one per poll (the old 3-in-70s storm)
#   scale_down_max_current_cpu 50
#                                no capacity withdrawn while the container is
#                                still pegged right now
#
# The band is NOT inverted any more. It used to set cpu_lower_threshold: 78 so
# that a ~52 forecast would read as "low"; with live calibration that hack is
# both unnecessary (idle forecasts are ~0-2%) and invalid (engine validation
# rejects lower >= upper). The demo now exercises the same band maths as
# production, just with a shorter memory.
#
# Usage:
#   python main.py --config config_demo.yaml

image: proximascale-worker:latest
container_prefix: proximascale-worker

min_containers: 0
max_containers: 10

cpu_quota: 50000
mem_limit: "256m"
cpu_period: 100000

cpu_upper_threshold: 75.0
cpu_lower_threshold: 30.0

adaptive_window: 8
adaptive_k: 1.5
adaptive_min_samples: 5
adaptive_floor_upper: 60.0
adaptive_ceil_upper: 90.0
adaptive_floor_lower: 10.0
adaptive_ceil_lower: 30.0
adaptive_min_band: 10.0

use_upper_bound_risk: true
use_anomaly_bypass: true
anomaly_min_interval_seconds: 300
scale_up_on_current_cpu: true

scale_down_max_current_cpu: 50.0
cooldown_seconds: 60
tick_seconds: 3

scale_down_strategy: newest

anomaly_z_threshold: 2.5
anomaly_min_cpu_percent: 5.0

restart_policy: unless-stopped
worker_health_check: true
readiness_timeout_seconds: 20
