# config.yaml (relevant keys)
image: proximascale-worker:latest
container_prefix: proximascale-worker

min_containers: 1
max_containers: 10                    # was 5 — matches locked spec

cpu_quota: 50000                      # 0.5 CPU
mem_limit: "256m"
cpu_period: 100000

cpu_upper_threshold: 75.0             # static fallback for adaptive
cpu_lower_threshold: 30.0

cooldown_seconds: 180

# Tuned for the v2 model on the VALIDATION period (model/tune_decisions.py,
# results/tuning/): the forecast mean alone anticipated every spike there with
# no false scale-ups, while the anomaly bypass and the upper-bound branch both
# added false or early scale-ups. Set either back to true to restore it.
use_anomaly_bypass: false             # anomaly flag no longer forces a scale-up
use_upper_bound_risk: false           # upper bound no longer triggers scale-ups
anomaly_scale_up_min_interval: 120    # min seconds between anomaly scale-ups:
                                      # the anomaly branch still bypasses the
                                      # cooldown, but one sustained spike must
                                      # not add a worker on every poll (0 = off)
scale_down_max_current_cpu: 75.0      # no scale-down while current CPU is above this
tick_seconds: 3

adaptive_window: 30
adaptive_k: 1.5
adaptive_min_samples: 10

scale_down_strategy: newest           # or "oldest" — pick one and update both docs

anomaly_z_threshold: 2.5              # model/anomaly.py's z-score cutoff.
                                       # 2.5 = current/production behavior (unchanged).
                                       # Bump to ~3.5 for a demo run so idle-load
                                       # jitter doesn't fire false "anomaly" scale-ups
                                       # that reset the cooldown timer.
anomaly_min_cpu_percent: 5.0           # absolute floor for anomaly detection:
                                       # a z-score is RELATIVE, so on an idle
                                       # container one jittery 0.35% reading among
                                       # 0.00-0.05% neighbors is 20+ stds and used
                                       # to fire "anomaly" scale-ups on a machine
                                       # doing no work. Readings below this floor
                                       # can never be a spike, whatever the z-score
                                       # says. Spike handling is unaffected: real
                                       # spikes are far above 5% in absolute terms.