name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip install --upgrade pip

      - run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - run: pytest || echo "No tests yet"
