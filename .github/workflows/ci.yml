name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only lightweight deps for CI so TensorFlow doesn't
          # blow the 6-minute budget. Model tests skip cleanly.
          pip install pandas numpy pyyaml psutil docker scikit-learn \
                      joblib pytest flake8 streamlit plotly matplotlib requests

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=100 --statistics

      - name: Run tests
        run: pytest tests/ -v