image: proximascale-worker:latest
container_prefix: proximascale-worker
min_containers: 1
max_containers: 10
cpu_quota: 50000
mem_limit: 256m
cpu_period: 100000
cpu_upper_threshold: 75.0
cpu_lower_threshold: 30.0
adaptive_window: 30
adaptive_k: 1.5
adaptive_min_samples: 10
adaptive_floor_upper: 60.0
adaptive_ceil_upper: 90.0
adaptive_floor_lower: 15.0
adaptive_ceil_lower: 45.0
adaptive_min_band: 10.0
cooldown_seconds: 180
tick_seconds: 3
use_anomaly_bypass: false
use_upper_bound_risk: false
scale_up_on_current_cpu: false
scale_down_max_current_cpu: 75.0
scale_down_strategy: newest
anomaly_z_threshold: 2.5
anomaly_min_cpu_percent: 5.0
restart_policy: unless-stopped
worker_health_check: true
readiness_timeout_seconds: 20
